<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0e0f" />
    <!-- Replaced per response by server/server.mjs; used for sandboxed website-section scripts. -->
    <meta name="csp-nonce" content="__CSP_NONCE__" />
    <title>ORVEX — Service Operations Platform</title>
    <script>
      try {
        var t = localStorage.getItem('orvex.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
